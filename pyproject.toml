[project]
name = "habittracker"
version = "0.1.0"
description = "Habit tracking REST API with streak statistics, built as a Python backend + test automation portfolio project."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
